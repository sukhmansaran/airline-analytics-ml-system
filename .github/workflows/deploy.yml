name: Deploy

# Manual-only: this workflow needs DOCKER_USERNAME and DOCKER_PASSWORD in
# repository secrets. Running it automatically on every push fails at the login
# step until those are set. Add the secrets, then trigger it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ba-ds-api:latest
            ${{ secrets.DOCKER_USERNAME }}/ba-ds-api:${{ github.sha }}
