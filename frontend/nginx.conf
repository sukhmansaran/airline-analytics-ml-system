server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the FastAPI service
    location /predict/ {
        proxy_pass http://ba_api:8000/predict/;
        proxy_set_header Host $host;
    }

    location /sentiment/ {
        proxy_pass http://ba_api:8000/sentiment/;
        proxy_set_header Host $host;
    }

    location /metrics/ {
        proxy_pass http://ba_api:8000/metrics/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://ba_api:8000/health;
        proxy_set_header Host $host;
    }
}
